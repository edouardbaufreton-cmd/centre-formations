<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Centre de formations</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:22px 18px;position:sticky;top:0}main{max-width:760px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}.row{display:flex;justify-content:space-between;gap:12px}.title{font-size:18px;font-weight:700}.muted{color:#6b7280;font-size:14px}.bar{height:9px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#2563eb}button{border:0;border-radius:10px;padding:10px 14px;background:#111827;color:white;font-weight:600}button.secondary{background:#e5e7eb;color:#111827}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:13px}</style></head><body><header><h1>📚 Centre de formations</h1><div>Tableau de bord de tes formations</div></header><main id="app"></main><script>
const K="formations";let d=JSON.parse(localStorage.getItem(K)||"null")||{f:[{id:"colere",n:"Maîtrise et transformation de la colère",day:1,total:30},{id:"eau",n:"Eau H₂O & biomécanismes du corps",day:1,total:30}]};
function save(){localStorage.setItem(K,JSON.stringify(d))}function render(){app.innerHTML=d.f.map(x=>{let p=Math.min(100,Math.round((x.day-1)/x.total*100));return `<section class="card"><div class="row"><div><div class="title">${x.n}</div><div class="muted">Jour ${x.day} / ${x.total}</div></div><b>${p}%</b></div><div class="bar"><div class="fill" style="width:${p}%"></div></div><div class="actions"><button onclick="course('${x.id}')">▶ Continuer</button><button class="secondary" onclick="done('${x.id}')">✓ Jour terminé</button><button class="secondary" onclick="del('${x.id}')">Supprimer</button></div></section>`}).join("")+`<section class="card"><button onclick="add()">＋ Ajouter une formation</button><p class="muted small">Les données sont conservées sur cet appareil.</p></section>`}
function course(id){let x=d.f.find(a=>a.id==id);alert("📚 "+x.n+"\n\nJour "+x.day+"/"+x.total+"\n\nOuvre ta conversation ChatGPT correspondante pour suivre le cours du jour.")}function done(id){let x=d.f.find(a=>a.id==id);if(x.day<x.total)x.day++;else alert("🎉 Formation terminée !");save();render()}function add(){let n=prompt("Nom de la formation ?");if(!n)return;let t=parseInt(prompt("Nombre de jours ?","30"))||30;d.f.push({id:Date.now(),n,day:1,total:t});save();render()}function del(id){if(confirm("Supprimer cette formation ?")){d.f=d.f.filter(x=>x.id!=id);save();render()}}render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
